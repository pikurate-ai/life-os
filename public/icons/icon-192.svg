<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017" />
      <stop offset="50%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- Core Dynamic Neon Gradient -->
    <linearGradient id="neonCore192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Accent -->
    <linearGradient id="glowAccent192" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <filter id="coreGlow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Squircle Base with Subtle Border -->
  <rect width="192" height="192" rx="43" fill="url(#bgGrad192)" />
  <rect x="1.5" y="1.5" width="189" height="189" rx="41.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ambient Light Reflection -->
  <path d="M 15 43 C 15 26 26 15 43 15 L 149 15 C 166 15 177 26 177 43 C 142 60 75 64 15 43 Z" fill="rgba(255, 255, 255, 0.04)" />

  <!-- Glowing Aura behind symbol -->
  <circle cx="96" cy="96" r="60" fill="#6366f1" opacity="0.18" filter="url(#coreGlow192)" />
  <circle cx="105" cy="90" r="45" fill="#06b6d4" opacity="0.15" filter="url(#coreGlow192)" />

  <!-- Life-OS Master Core: Scaled up to fill the icon without text -->
  <g transform="translate(96, 96) scale(0.51)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" stroke-dasharray="16 12" />

    <!-- Pulse Node Outer Points -->
    <circle cx="0" cy="-135" r="7" fill="#818cf8" />
    <circle cx="117" cy="68" r="7" fill="#38bdf8" />
    <circle cx="-117" cy="68" r="7" fill="#34d399" />

    <!-- Isometric Geometric Core (Precision L & Shield) -->
    <!-- Wing Left -->
    <path d="M -70 -80 L -20 -110 L -20 50 L -70 80 Z" fill="url(#neonCore192)" opacity="0.95" />
    <!-- Wing Right Bottom (L-Bar) -->
    <path d="M -15 52 L 75 104 L 75 60 L -15 8 Z" fill="url(#glowAccent192)" />
    <!-- Dynamic Infinity Hook -->
    <path d="M -15 -107 L 70 -58 L 70 15 L 25 -10 L 25 -32 L -15 -55 Z" fill="#ffffff" opacity="0.95" />

    <!-- Central Fusion Core Pulse -->
    <circle cx="5" cy="5" r="24" fill="#06b6d4" filter="url(#coreGlow192)" opacity="0.9" />
    <circle cx="5" cy="5" r="13" fill="#ffffff" />
  </g>
</svg>
